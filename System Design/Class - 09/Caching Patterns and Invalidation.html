function renderFlowDiagram(flow, highlight) {
  const hl = new Set(highlight || []);
  const ranks = {};
  flow.nodes.forEach(n => {
    if (!ranks[n.rank]) ranks[n.rank] = [];
    ranks[n.rank].push(n);
  });
  const rankKeys = Object.keys(ranks).map(Number).sort((a,b) => a-b);
  const nw = 110, nh = 34, rg = 52, ng = 24, pad = 20;
  const positions = {};
  let maxW = 0;
  rankKeys.forEach(rk => {
    const row = ranks[rk];
    const rowW = row.length * nw + (row.length - 1) * ng;
    maxW = Math.max(maxW, rowW);
  });
  rankKeys.forEach(rk => {
    const row = ranks[rk];
    const rowW = row.length * nw + (row.length - 1) * ng;
    const startX = pad + (maxW - rowW) / 2;
    row.forEach((n, i) => {
      positions[n.id] = { x: startX + i * (nw + ng), y: pad + rk * (nh + rg), w: nw, h: nh };
    });
  });
  const totalH = pad * 2 + rankKeys.length * nh + (rankKeys.length - 1) * rg;
  const totalW = pad * 2 + maxW;
  let svg = `<svg class="flow-svg" viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}">`;
  svg += `<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#858585"/></marker></defs>`;
  flow.edges.forEach(e => {
    const a = positions[e.from], b = positions[e.to];
    if (!a || !b) return;
    const x1 = a.x + a.w / 2, y1 = a.y + a.h;
    const x2 = b.x + b.w / 2, y2 = b.y;
    if (a.y === b.y) { /* same rank horizontal */ }
    const sx = a.y < b.y ? a.x + a.w/2 : a.x + a.w;
    const sy = a.y < b.y ? a.y + a.h : a.y + a.h/2;
    const tx = a.y < b.y ? b.x + b.w/2 : b.x;
    const ty = a.y < b.y ? b.y : b.y + b.h/2;
    const useVert = a.y !== b.y;
    if (useVert) {
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#858585" stroke-width="1.5" marker-end="url(#arr)"/>`;
      if (e.label) svg += `<text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" text-anchor="middle" fill="#858585" font-size="9">${e.label}</text>`;
    } else {
      svg += `<line x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}" stroke="#858585" stroke-width="1.5" marker-end="url(#arr)"/>`;
    }
  });
  flow.nodes.forEach(n => {
    const p = positions[n.id];
    const on = hl.has(n.id);
    svg += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="4" fill="${on ? '#1a3a5c' : '#252526'}" stroke="${on ? '#3794ff' : '#3c3c3c'}" stroke-width="${on ? 2 : 1}"/>`;
    svg += `<text x="${p.x + p.w/2}" y="${p.y + p.h/2 + 4}" text-anchor="middle" fill="${on ? '#3794ff' : '#ccc'}" font-size="10" font-weight="${on ? 600 : 400}">${n.label}</text>`;
  });
  svg += `</svg>`;
  return `<div class="flow-wrap">${svg}</div>`;
}

function renderBarChart(categories, series, suffix = "") {
  const max = Math.max(...series.flatMap(s => s.data), 1);
  let html = `<div class="bar-chart">`;
  categories.forEach((cat, ci) => {
    html += `<div class="bar-col"><div class="bar-stack">`;
    series.forEach((s, si) => {
      const v = s.data[ci] || 0;
      const h = Math.max(2, (v / max) * 110);
      const colors = ["#3794ff", "#4ec9b0", "#dcdcaa", "#f48771"];
      html += `<div class="bar-seg" style="height:${h}px;background:${s.color || colors[si % colors.length]}" title="${s.name}: ${v}${suffix}"></div>`;
    });
    html += `</div><div class="bar-val">${series.length === 1 ? series[0].data[ci] + suffix : ""}</div><div class="bar-label">${cat}</div></div>`;
  });
  html += `</div>`;
  if (series.length > 1) {
    html += `<div class="row">${series.map((s,i) => `<span style="font-size:0.75rem;color:var(--muted)"><span style="display:inline-block;width:10px;height:10px;background:${s.color||['#3794ff','#4ec9b0','#dcdcaa'][i]};border-radius:2px;margin-right:4px"></span>${s.name}</span>`).join("")}</div>`;
  }
  return html;
}

function renderLineChart(categories, data, suffix = "%") {
  const max = 100, min = 0, w = 600, h = 130, pad = 20;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    return `${x},${y}`;
  }).join(" ");
  const budget = 10;
  const by = h - pad - ((budget - min) / (max - min)) * (h - pad * 2);
  return `<div class="line-chart"><svg viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${by}" x2="${w-pad}" y2="${by}" stroke="#f48771" stroke-dasharray="4 3" stroke-width="1"/>
    <text x="${w-pad-4}" y="${by-4}" text-anchor="end" fill="#f48771" font-size="9">Budget ${budget}${suffix}</text>
    <polyline points="${pts}" fill="none" stroke="#4ec9b0" stroke-width="2"/>
    ${data.map((v,i) => { const x = pad + (i/(data.length-1))*(w-pad*2); const y = h-pad-((v-min)/(max-min))*(h-pad*2); return `<circle cx="${x}" cy="${y}" r="3" fill="#4ec9b0"/>`; }).join("")}
  </svg></div>
  <div class="row">${categories.map(c => `<span style="font-size:0.65rem;color:var(--muted)">${c}</span>`).join("")}</div>`;
}

function getRecommendation() {
  if (state.consistency === "strong") return {
    pattern: "write-through", invalidation: "write-invalidate",
    eviction: "No TTL — invalidate on write",
    layers: "L1 optional → L2 Redis (consistent)",
    reason: "Strong consistency required — synchronous write path, no stale reads.",
  };
  if (state.readRatio > 90 && state.dataSize === "small") return {
    pattern: "cache-aside", invalidation: "event",
    eviction: "LRU, allkeys-lru",
    layers: "CDN → Redis cluster → DB replicas",
    reason: "Read-heavy hot keys — cache-aside + event invalidation scales best.",
  };
  if (state.readRatio > 90 && state.dataSize === "large") return {
    pattern: "read-through", invalidation: "ttl",
    eviction: "LFU for long-tail, LRU for hot set",
    layers: "CDN (large objects) → Redis (metadata) → S3/DB",
    reason: "Large objects — CDN + metadata cache, don't cache full payloads in Redis.",
  };
  return {
    pattern: "write-behind", invalidation: "ttl",
    eviction: "TTL-based + maxmemory",
    layers: "Redis write buffer → async DB flush",
    reason: "Write-heavy — absorb spikes with write-behind, accept eventual persistence.",
  };
}

    </div>
    <h2>Interview One-Liner</h2>
    <blockquote>"For {service}, I'd use <strong>cache-aside</strong> because reads dominate at 95:5. Invalidation via <strong>write-invalidate + 5min TTL safety net</strong>. Staleness budget is <strong>30 seconds</strong>. Layers: L1 in-process (100ms) → L2 Redis with LRU and maxmemory at 80% RAM."</blockquote>
    <h2>Key Takeaways</h2>
    <ul>
      <li><strong>Cache-Aside</strong> is your default — know it cold.</li>
      <li><strong>Never rely on TTL alone</strong> for data that changes and matters.</li>
      <li><strong>Define staleness budget first</strong>, then pick invalidation.</li>
      <li><strong>Combine methods</strong> — write-invalidate + TTL safety net.</li>
      <li><strong>Multi-layer</strong> — CDN for static, Redis for hot keys, DB for truth.</li>
      <li><strong>Always configure maxmemory</strong> — unbounded cache kills the cluster.</li>
    </ul>`;
}

function renderPatterns() {
  const p = state.pattern;
  const meta = PATTERN_META[p];
  const flow = PATTERN_FLOWS[p];
  const step = Math.min(state.patternStep, flow.steps.length - 1);
  return `
    <p><strong>Core question:</strong> Who reads/writes the cache — the app or the cache layer?</p>
    <div class="row">
      ${Object.keys(PATTERN_META).map(id => `
        <button class="btn-ghost${state.pattern===id?' active':''}" data-pattern="${id}">${PATTERN_META[id].short}</button>
      `).join("")}
    </div>
    <div class="card">
      <div class="card-title">${meta.name} <span class="pill">Step ${step+1}/${flow.steps.length}</span></div>
      <p>${meta.tagline}</p>
      ${renderFlowDiagram(flow, flow.highlights[step])}
      <div class="callout">${flow.steps[step]}</div>
      <div class="row">
        <button class="btn-ghost" id="patPrev" ${step===0?'disabled':''}>Previous</button>
        <button class="btn-primary" id="patNext" ${step===flow.steps.length-1?'disabled':''}>Next Step</button>
        <button class="btn-ghost" id="patReset">Reset</button>
      </div>
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-title">Real-World Case</div><p>${meta.realWorld}</p></div>
      <div class="card"><div class="card-title">When to Use</div><p>${meta.when}</p></div>
    </div>
    <h2>Pattern Cheat Sheet</h2>
    <table>
      <tr><th>Pattern</th><th>Read Path</th><th>Write Path</th><th>Consistency</th></tr>
      <tr><td>Cache-Aside</td><td>App → Cache → DB on miss</td><td>App writes DB, invalidates cache</td><td>Eventual</td></tr>
      <tr><td>Read-Through</td><td>Cache auto-loads on miss</td><td>App writes DB directly</td><td>Eventual</td></tr>
      <tr><td>Write-Through</td><td>Cache always fresh</td><td>Sync to cache + DB</td><td>Strong</td></tr>
      <tr><td>Write-Behind</td><td>Cache may be ahead of DB</td><td>Cache first, async DB</td><td>Eventual</td></tr>
    </table>
    <h2>Pros / Cons — ${meta.short}</h2>
    <table>
      <tr><th>Pros</th><th>Cons</th></tr>
      ${meta.pros.map((pro,i) => `<tr><td>${pro}</td><td>${meta.cons[i]||""}</td></tr>`).join("")}
    </table>
    <h2>Mermaid — ${meta.short} Sequence</h2>
    <div class="mermaid mermaid-pattern">${getPatternMermaid(p)}</div>`;
}

function getPatternMermaid(p) {
  const m = {
    "cache-aside": `sequenceDiagram
    participant C as Client
    participant A as App
    participant R as Redis
    participant D as Database
    C->>A: GET /product/42
    A->>R: GET key
    alt Cache MISS
        R-->>A: null
        A->>D: SELECT
        D-->>A: row
        A->>R: SET key TTL=300s
    end
    A-->>C: 200 OK`,
    "read-through": `sequenceDiagram
    participant A as App
    participant C as Cache Library
    participant D as Database
    A->>C: cache.get("user:123")
    C->>D: SELECT on miss
    D-->>C: row
    C-->>A: value`,
    "write-through": `sequenceDiagram
    participant A as App
    participant C as Cache
    participant D as Database
    A->>C: write session
    C->>D: sync write
    D-->>C: ACK
    C-->>A: ACK`,
    "write-behind": `sequenceDiagram
    participant A as App
    participant C as Redis
    participant D as Database
    A->>C: INCR counter
    C-->>A: ACK
    Note over C,D: async batch flush
    C->>D: batch write`,
  };
  return m[p];
}

function renderInvalidation() {
  const m = INVALIDATION_META[state.invalidation];
  const scen = SCENARIO_META[state.invScenario];
  const timeline = STALENESS_PROFILES[state.invalidation];
  const match = scen.recommendedInvalidation === state.invalidation;
  const cats = ["t+0s","t+1s","t+2s","t+3s","t+5s","t+10s","t+30s","t+60s","t+5m","t+10m"];
  return `
    <p><strong>Core question:</strong> How does the cache know data changed?</p>
    <blockquote>"There are only two hard things in CS: cache invalidation and naming things."</blockquote>
    <div class="row">
      <label>Method: </label>
      <select id="invSelect">
        ${Object.keys(INVALIDATION_META).map(k => `<option value="${k}"${state.invalidation===k?' selected':''}>${INVALIDATION_META[k].name}</option>`).join("")}
      </select>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">${m.name}</div>
        <p><strong>Mechanism:</strong> ${m.mechanism}</p>
        <p><strong>Real case:</strong> ${m.realWorld}</p>
        <div class="grid-2">
          <div class="stat"><div class="stat-label">Coordination</div><div class="stat-value">${m.latency}</div></div>
          <div class="stat"><div class="stat-label">Consistency</div><div class="stat-value">${m.consistency}</div></div>
        </div>
      </div>
      <div>
        <h2>Staleness after write (simulated)</h2>
        ${renderLineChart(cats, timeline)}
      </div>
    </div>
    <h2>Pick a scenario</h2>
    <div class="row">
      ${Object.keys(SCENARIO_META).map(k => `
        <button class="btn-ghost${state.invScenario===k?' active':''}" data-scenario="${k}">${SCENARIO_META[k].name}</button>
      `).join("")}
    </div>
    <div class="grid-3">
      <div class="stat"><div class="stat-label">Staleness budget</div><div class="stat-value warn">${scen.stalenessBudget}</div></div>
      <div class="stat"><div class="stat-label">Best pattern</div><div class="stat-value">${PATTERN_META[scen.recommendedPattern].short}</div></div>
      <div class="stat"><div class="stat-label">Best invalidation</div><div class="stat-value ok">${INVALIDATION_META[scen.recommendedInvalidation].name}</div></div>
    </div>
    <p>${scen.description}</p>
    <div class="callout ${match?'success':'warn'}">${match
      ? `${m.name} fits ${scen.name}. TTL safety net: ${scen.ttl}.`
      : `For ${scen.name}, prefer ${INVALIDATION_META[scen.recommendedInvalidation].name} over ${m.name}. Budget: ${scen.stalenessBudget}.`}</div>
    <h2>Write-Invalidate Flow</h2>
    <div class="mermaid">
sequenceDiagram
    participant A as App
    participant R as Redis
    participant D as Database
    A->>D: UPDATE profile
    D-->>A: OK
    A->>R: DELETE cache:user:123
    A->>R: GET cache:user:123
    R-->>A: MISS
    A->>D: SELECT fresh row
    A->>R: SET cache:user:123
    </div>
    <h2>Event-Driven (Multi-Region)</h2>
    <div class="mermaid">
flowchart LR
    W[Write Service] --> DB[(Database)]
    W --> K[Kafka Event]
    K --> R1[Redis R1]
    K --> R2[Redis R2]
    K --> R3[Redis RN]
    </div>
    <table class="striped">
      <tr><th>Method</th><th>Consistency</th><th>Best For</th></tr>
      <tr><td>TTL</td><td>Eventual</td><td>CDN, weather, static config</td></tr>
      <tr><td>Write-Invalidate</td><td>Good</td><td>User profiles, CRUD APIs</td></tr>
      <tr><td>Event-Driven</td><td>Strong-ish</td><td>Multi-region inventory</td></tr>
      <tr><td>Versioning/Tags</td><td>Strong for groups</td><td>CMS, tagged pages</td></tr>
    </table>
    <div class="callout">Production tip: combine write-invalidate + TTL as safety net.</div>`;
}

function renderStaleness() {
  const avg = state.useEventInv ? Math.min(2, 100 / Math.max(state.writeRate, 1)) : state.ttl / 2;
  const stalePct = state.useEventInv ? Math.min(5, state.writeRate * 0.3) : Math.min(95, (state.ttl / 120) * 40 + state.writeRate * 0.5);
  const spread = state.ttl / 60;
  const dist = state.useEventInv
    ? [85, 10, 3, 1, 1]
    : [Math.max(5, 40-spread*10), Math.min(35, 10+spread*8), Math.min(30, 5+spread*10), Math.min(25, spread*8), Math.min(20, spread*5)];
  return `
    <div class="callout">Staleness = how long cached data diverges from truth after a write. Define a <strong>staleness budget</strong>, then pick TTL + invalidation to stay inside it.</div>
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Controls</div>
        <p><strong>TTL:</strong> ${state.ttl}s</p>
        <div class="row">${[30,60,300,900,3600].map(v => `<button class="btn-ghost${state.ttl===v?' active':''}" data-ttl="${v}">${v<60?v+'s':v<3600?(v/60)+'m':(v/3600)+'h'}</button>`).join("")}</div>
        <p><strong>Writes/min:</strong> ${state.writeRate}</p>
        <div class="row">${[1,5,10,50,100].map(v => `<button class="btn-ghost${state.writeRate===v?' active':''}" data-wrate="${v}">${v}/min</button>`).join("")}</div>
        <label class="check"><input type="checkbox" id="eventInv" ${state.useEventInv?'checked':''}/> Event-driven invalidation enabled</label>
      </div>
      <div>
        <h2>Computed metrics</h2>
        <div class="grid-2">
          <div class="stat"><div class="stat-label">Avg staleness window</div><div class="stat-value ${avg>30?'bad':'ok'}">${avg.toFixed(1)}s</div></div>
          <div class="stat"><div class="stat-label">Stale read probability</div><div class="stat-value ${stalePct>10?'warn':'ok'}">${stalePct.toFixed(1)}%</div></div>
        </div>
      </div>
    </div>
    <h2>Staleness duration distribution</h2>
    ${renderBarChart(["0-5s","5-15s","15-30s","30-60s","60s+"], [{ name: "Stale reads", data: dist }], "%")}
    <h2>Timeline comparison (after write)</h2>
    <div class="timeline-bar">
TTL-only (300s):          ████████████████████░░░░  stale up to 5 min
Write-invalidate:         ████░░░░░░░░░░░░░░░░░░░░  stale ~1 read cycle
Event-driven:             ██░░░░░░░░░░░░░░░░░░░░░░  stale ~propagation delay
    </div>
    <div class="grid-2">
      <div class="card"><div class="card-title">Flash sale (Prime Day)</div>
        <p>Problem: TTL-only → old price up to 5 min.</p>
        <p><strong>Fix:</strong> write-invalidate on price change + 30s TTL safety net.</p></div>
      <div class="card"><div class="card-title">Leaderboard scores</div>
        <p>Problem: over-engineering strong consistency wastes resources.</p>
        <p><strong>Fix:</strong> accept 30s staleness; write-behind counters.</p></div>
    </div>
    <table class="striped">
      <tr><th>Level</th><th>Impact</th><th>Example</th><th>OK?</th></tr>
      <tr><td>0s</td><td>Always correct</td><td>Bank balance, checkout inventory</td><td>Required</td></tr>
      <tr><td>1–5s</td><td>Invisible</td><td>Social likes, view counts</td><td>Usually yes</td></tr>
      <tr><td>30s–5min</td><td>Noticeable</td><td>News feed, stock ticker</td><td>Case by case</td></tr>
      <tr><td>Hours+</td><td>Immutable data</td><td>CDN assets, static config</td><td>Yes</td></tr>
    </table>`;
}

function renderStrategy() {
  const rec = getRecommendation();
  const latency = [
    { p: "cache-aside", hit: 2, miss: 48, write: 5 },
    { p: "read-through", hit: 2, miss: 45, write: 8 },
    { p: "write-through", hit: 2, miss: 8, write: 52 },
    { p: "write-behind", hit: 1, miss: 3, write: 2 },
  ];
  return `
    <p>Cache strategy = pattern + invalidation + eviction + layering.</p>
    <div class="card">
      <div class="card-title">Decision Inputs</div>
      <p><strong>Read ratio:</strong> ${state.readRatio}%</p>
      <div class="row">${[50,80,95,99].map(v => `<button class="btn-ghost${state.readRatio===v?' active':''}" data-read="${v}">${v}%</button>`).join("")}</div>
      <p><strong>Consistency:</strong></p>
      <div class="row">
        <button class="btn-ghost${state.consistency==='eventual'?' active':''}" data-cons="eventual">Eventual OK</button>
        <button class="btn-ghost${state.consistency==='strong'?' active':''}" data-cons="strong">Strong Required</button>
      </div>
      <p><strong>Object size:</strong></p>
      <div class="row">
        <button class="btn-ghost${state.dataSize==='small'?' active':''}" data-size="small">Small (&lt;1KB)</button>
        <button class="btn-ghost${state.dataSize==='large'?' active':''}" data-size="large">Large (&gt;100KB)</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Your Architecture Prescription <span class="pill">Recommended</span></div>
      <div class="grid-2">
        <div class="stat"><div class="stat-label">Pattern</div><div class="stat-value">${PATTERN_META[rec.pattern].short}</div></div>
        <div class="stat"><div class="stat-label">Invalidation</div><div class="stat-value">${INVALIDATION_META[rec.invalidation].name}</div></div>
        <div class="stat"><div class="stat-label">Eviction</div><div class="stat-value">${rec.eviction}</div></div>
        <div class="stat"><div class="stat-label">Layers</div><div class="stat-value">${rec.layers}</div></div>
      </div>
      <div class="callout success">${rec.reason}</div>
    </div>
    <h2>Pattern latency comparison (typical ms)</h2>
    ${renderBarChart(
      latency.map(l => PATTERN_META[l.p].short),
      [
        { name: "Read (hit)", data: latency.map(l => l.hit), color: "#4ec9b0" },
        { name: "Read (miss)", data: latency.map(l => l.miss), color: "#dcdcaa" },
        { name: "Write", data: latency.map(l => l.write), color: "#3794ff" },
      ],
      " ms"
    )}
    <h2>Decision Tree</h2>
    <div class="mermaid">
flowchart TD
    A[New Service] --> B{Strong consistency?}
    B -->|Yes| C[Write-Through + Write-Invalidate]
    B -->|No| D{Read ratio > 90%?}
    D -->|Yes| E{Object size?}
    E -->|Small| F[Cache-Aside + Event Invalidation]
    E -->|Large| G[CDN + Redis metadata]
    D -->|No| H[Write-Behind + TTL]
    </div>
    <h2>Multi-Layer Architecture</h2>
    <div class="mermaid">
flowchart TD
    U[User] --> CDN[CDN Edge TTL 24h]
    U --> GW[API Gateway]
    GW --> L1[L1 In-Process TTL 100ms]
    L1 -->|miss| L2[L2 Redis TTL 5min]
    L2 -->|miss| DB[(Database)]
    </div>
    <h2>Scenario Prescriptions</h2>
    <table class="striped">
      <tr><th>Scenario</th><th>Pattern</th><th>Invalidation</th><th>Staleness Budget</th></tr>
      ${Object.values(SCENARIO_META).map(s => `<tr><td>${s.name}</td><td>${PATTERN_META[s.recommendedPattern].short}</td><td>${INVALIDATION_META[s.recommendedInvalidation].name}</td><td>${s.stalenessBudget}</td></tr>`).join("")}
    </table>
    <h2>Eviction Policies</h2>
    <table class="striped">
      <tr><th>Policy</th><th>Evicts</th><th>Best For</th><th>Watch Out</th></tr>
      <tr><td>LRU</td><td>Least recently used</td><td>General web caching</td><td>Scan attacks evict hot keys</td></tr>
      <tr><td>LFU</td><td>Least frequently used</td><td>Long-tail content</td><td>New keys evicted early</td></tr>
      <tr><td>TTL-only</td><td>Expired keys</td><td>CDN, time-bound data</td><td>Memory fills before TTL</td></tr>
      <tr><td>Random</td><td>Random key</td><td>Prototypes only</td><td>Unpredictable in prod</td></tr>
    </table>
    <div class="callout warn">Always set maxmemory + eviction policy. Unbounded cache = OOM crash.</div>`;
}

function bindEvents() {
  document.querySelectorAll("#mainTabs .tab").forEach(t => {
    t.onclick = () => { state.tab = t.dataset.id; save(); };
  });

  document.querySelectorAll("[data-pattern]").forEach(b => {
    b.onclick = () => { state.pattern = b.dataset.pattern; state.patternStep = 0; save(); };
  });
  const patPrev = document.getElementById("patPrev");
  const patNext = document.getElementById("patNext");
  const patReset = document.getElementById("patReset");
  if (patPrev) patPrev.onclick = () => { state.patternStep = Math.max(0, state.patternStep - 1); save(); };
  if (patNext) patNext.onclick = () => { state.patternStep = Math.min(PATTERN_FLOWS[state.pattern].steps.length - 1, state.patternStep + 1); save(); };
  if (patReset) patReset.onclick = () => { state.patternStep = 0; save(); };

  const invSelect = document.getElementById("invSelect");
  if (invSelect) invSelect.onchange = e => { state.invalidation = e.target.value; save(); };
  document.querySelectorAll("[data-scenario]").forEach(b => {
    b.onclick = () => { state.invScenario = b.dataset.scenario; save(); };
  });

  document.querySelectorAll("[data-ttl]").forEach(b => {
    b.onclick = () => { state.ttl = +b.dataset.ttl; save(); };
  });
  document.querySelectorAll("[data-wrate]").forEach(b => {
    b.onclick = () => { state.writeRate = +b.dataset.wrate; save(); };
  });
  const eventInv = document.getElementById("eventInv");
  if (eventInv) eventInv.onchange = e => { state.useEventInv = e.target.checked; save(); };

  document.querySelectorAll("[data-read]").forEach(b => {
    b.onclick = () => { state.readRatio = +b.dataset.read; save(); };
  });
  document.querySelectorAll("[data-cons]").forEach(b => {
    b.onclick = () => { state.consistency = b.dataset.cons; save(); };
  });
  document.querySelectorAll("[data-size]").forEach(b => {
    b.onclick = () => { state.dataSize = b.dataset.size; save(); };
  });
}

async function renderMermaid() {
  const nodes = document.querySelectorAll(".mermaid");
  for (const el of nodes) {
    const src = el.textContent.trim();
    el.removeAttribute("data-processed");
    try {
      const { svg } = await mermaid.render("m" + Math.random().toString(36).slice(2), src);
      el.innerHTML = svg;
    } catch (e) {
      el.innerHTML = `<pre style="color:var(--danger);font-size:0.8rem">${e.message}</pre>`;
    }
  }
}

function render() {
  document.getElementById("mainTabs").innerHTML = TABS.map(t =>
    `<button class="tab${state.tab===t.id?' active':''}" data-id="${t.id}">${t.label}</button>`
  ).join("");

  const renderers = {
    overview: renderOverview,
    patterns: renderPatterns,
    invalidation: renderInvalidation,
    staleness: renderStaleness,
    strategy: renderStrategy,
  };
  document.getElementById("content").innerHTML = renderers[state.tab]();
  bindEvents();
  renderMermaid();
}

render();
</script>
</body>
</html>
